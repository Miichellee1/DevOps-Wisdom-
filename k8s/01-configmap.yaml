# Configuracion no sensible del microservicio (config fuera de la imagen)
# Las credenciales de la base de datos (usuario y clave) NO se versionan: el pipeline crea el
# Secret "bdget-db-secret" con una clave aleatoria en cada despliegue (ver README, seccion Kubernetes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: bdget-config
  namespace: bdget
  labels:
    app: bdget
data:
  SPRING_PROFILES_ACTIVE: "prod"
  # El puerto usa el valor por defecto de PostgreSQL (5432) definido en application-prod.properties
  DB_HOST: "bdget-db"
  DB_NAME: "bdget"
  JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
