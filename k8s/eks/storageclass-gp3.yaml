# StorageClass por defecto para EKS: discos EBS gp3 creados por el driver aws-ebs-csi-driver.
# Lo usa el volumen persistente de PostgreSQL (volumeClaimTemplates del StatefulSet).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
