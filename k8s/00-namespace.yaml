# Namespace dedicado: aisla los recursos del microservicio y permite aplicar cuotas
apiVersion: v1
kind: Namespace
metadata:
  name: bdget
  labels:
    app.kubernetes.io/part-of: bdget
    # Pod Security Standards: el namespace solo admite pods con perfil "restricted"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Gobernanza: limita el consumo total de recursos del namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bdget-quota
  namespace: bdget
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "12"
