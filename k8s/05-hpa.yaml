# Autoescalado horizontal: 2 a 5 replicas segun uso de CPU y memoria (requiere metrics-server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bdget-hpa
  namespace: bdget
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bdget-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # Evita oscilaciones: espera 5 minutos estable antes de reducir replicas
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
