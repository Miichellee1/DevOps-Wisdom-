# Perfil productivo (docker-compose): PostgreSQL con credenciales inyectadas por variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:bdget}
spring.datasource.username=${DB_USER:bdget}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.cloud.config.enabled=false
logging.level.root=WARN
logging.level.com.example.bdget=INFO
