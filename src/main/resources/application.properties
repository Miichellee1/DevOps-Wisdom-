spring.application.name=bdget
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.max-attempts=5
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.multiplier=1.5
spring.cloud.config.retry.max-interval=5000

logging.level.root=INFO

# Base de datos H2 en memoria (perfil por defecto): simula un entorno cloud sin depender de
# infraestructura externa ni credenciales reales. Se reinicia en cada arranque.
# En docker-compose se activa el perfil "prod", que usa PostgreSQL (application-prod.properties).
spring.datasource.url=jdbc:h2:mem:bdgetdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2: deshabilitada por seguridad. Solo se habilita con el perfil "dev"
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

server.port=8080
server.shutdown=graceful

# Actuator: health (liveness/readiness para Docker y Kubernetes) e info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=bdget
info.app.version=${APP_VERSION:local}
info.app.commit=${GIT_COMMIT:local}
