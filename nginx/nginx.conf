# Balanceador de carga / reverse proxy delante de las replicas del microservicio
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Directorios temporales en /tmp para permitir ejecucion sin root y FS de solo lectura
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # DNS interno de Docker: resuelve todas las replicas del servicio "bdget-service"
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream bdget_backend {
        zone bdget_backend 64k;
        server bdget-service:8080 resolve;
    }

    server {
        listen 8080;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://bdget_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
