version: '3.8'

services:
  bdget-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: bdget:1.0.0
    container_name: bdget-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    # Parametros de escalabilidad, limites de recursos y gobernanza (IE3 / IE5)
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/students || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - bdget-network

networks:
  bdget-network:
    driver: bridge
