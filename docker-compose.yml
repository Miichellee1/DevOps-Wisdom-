# ==============================================================
# Orquestacion del entorno cloud simulado (IE4 / IE5)
#   gateway (nginx)  ->  bdget-service (N replicas)  ->  db (PostgreSQL)
# ==============================================================
name: bdget

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bdget}
      POSTGRES_USER: ${DB_USER:-bdget}
      # Valor por defecto solo para el entorno simulado; en otros entornos se define en .env o secretos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bdget-local}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped
    networks:
      - backend

  bdget-service:
    build:
      context: .
      dockerfile: Dockerfile
    # En el pipeline IMAGE apunta a la imagen ya construida y escaneada (ghcr.io/...:sha-xxxx)
    image: ${IMAGE:-bdget:local}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_NAME: ${DB_NAME:-bdget}
      DB_USER: ${DB_USER:-bdget}
      DB_PASSWORD: ${DB_PASSWORD:-bdget-local}
    depends_on:
      db:
        condition: service_healthy
    # Parametros de escalabilidad, limites de recursos y gobernanza (IE3 / IE5)
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: on-failure:3
    # Hardening en tiempo de ejecucion
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - backend

  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      bdget-service:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    restart: unless-stopped
    networks:
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  # Red interna: la base de datos no es accesible desde fuera
  backend:
    driver: bridge
    internal: true

volumes:
  db-data:
