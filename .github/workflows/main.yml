name: Pipeline CI/CD DevSecOps y Despliegue Orquestado

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Gobernanza: privilegio minimo por defecto; cada job solicita solo los permisos que necesita
permissions:
  contents: read

# Evita ejecuciones duplicadas sobre la misma rama/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  IMAGE_NAME: ghcr.io/miichellee1/devops-wisdom
  TRIVY_VERSION: v0.76.1
  # Espejos de las bases de vulnerabilidades de Trivy (evita limites de descarga de ghcr.io)
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1

jobs:
  # ==============================================================
  # 1. Pruebas Automatizadas y Politica de Cobertura (IE2)
  # ==============================================================
  build-test:
    name: 1. Pruebas Unitarias/Integracion y Cobertura (JUnit 5 + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar JDK 17 Temurin
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar, ejecutar pruebas y validar cobertura minima (jacoco:check >= 80%)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publicar resumen de pruebas y cobertura
        if: always()
        run: |
          {
            echo "## Resultados de pruebas automatizadas"
            echo ""
            echo "| Suite | Tests | Fallos | Errores | Omitidos |"
            echo "|---|---|---|---|---|"
            for f in target/surefire-reports/TEST-*.xml; do
              [ -f "$f" ] || continue
              name=$(grep -o 'testsuite [^>]*name="[^"]*"' "$f" | sed -E 's/.*name="([^"]*)".*/\1/' | sed 's/.*\.//')
              tests=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              failures=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              errors=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              skipped=$(grep -o 'skipped="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              echo "| ${name} | ${tests} | ${failures} | ${errors} | ${skipped} |"
            done
            if [ -f target/site/jacoco/jacoco.csv ]; then
              echo ""
              awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "**Cobertura de lineas (JaCoCo):** %.1f%% (minimo exigido: 80%%)\n", (c*100)/(m+c)}' target/site/jacoco/jacoco.csv
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reportes-calidad
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ==============================================================
  # 2. Analisis Estatico de Codigo con SonarCloud + Quality Gate (IE2 / IE3)
  # ==============================================================
  sonarcloud:
    name: 2. Analisis de Codigo y Quality Gate (SonarCloud)
    needs: build-test
    # Los PR de Dependabot no reciben secretos del repositorio; su codigo ya se valida con Trivy
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Clonar repositorio (historial completo para el analisis)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar JDK 17 Temurin
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache de paquetes de SonarCloud
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Verificar que el token de SonarCloud este configurado
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Falta el secreto SONAR_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Analisis SonarCloud (BLOQUEO si el Quality Gate falla)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  # ==============================================================
  # 3. Escaneo de Dependencias, Secretos e IaC con Trivy + Bloqueo (IE3)
  # ==============================================================
  security-scan:
    name: 3. Escaneo de Vulnerabilidades SCA y Security Gate (Trivy)
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar JDK 17 Temurin
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # Trivy analiza pom.xml leyendo el repositorio local de Maven (~/.m2) en lugar de
      # consultar Maven Central en cada ejecucion (evita errores HTTP 429 por limite de peticiones)
      - name: Resolver dependencias Maven en cache local
        run: |
          chmod +x mvnw
          ./mvnw -B -q dependency:go-offline

      - name: Reporte SARIF de dependencias y secretos (todas las severidades)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: true
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          trivyignores: '.trivyignore'
          exit-code: '0'

      - name: Reporte SARIF de configuracion IaC (Dockerfile, Compose, Kubernetes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          exit-code: '0'

      - name: Publicar alertas en GitHub Security (dependencias)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-dependencias'

      - name: Publicar alertas en GitHub Security (IaC)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-iac'

      - name: Security Gate - BLOQUEO por vulnerabilidades CRITICAL/HIGH con parche disponible
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: true
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'

  # ==============================================================
  # 4. Construccion, Escaneo y Publicacion de la Imagen Docker (IE1 / IE3 / IE4)
  # ==============================================================
  build-image:
    name: 4. Construccion, Escaneo y Publicacion de Imagen Docker (OCI)
    needs: [build-test, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Definir etiqueta trazable de la imagen (SHA del commit)
        id: vars
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generar metadatos OCI (etiquetas y labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir imagen Docker multi-etapa (con cache de capas)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security Gate de la imagen - BLOQUEO por CRITICAL/HIGH con parche disponible
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ steps.vars.outputs.image }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'

      - name: Generar SBOM de la imagen (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ steps.vars.outputs.image }}
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'
          exit-code: '0'

      # La misma imagen escaneada es la que se despliega en los jobs siguientes
      - name: Exportar imagen aprobada como artefacto
        run: docker save "${{ steps.vars.outputs.image }}" -o bdget-image.tar

      - name: Subir imagen y SBOM como artefactos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagen-docker
          path: |
            bdget-image.tar
            sbom-cyclonedx.json
          retention-days: 7

      - name: Iniciar sesion en GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen en GHCR (solo push a develop/main)
        id: push
        if: github.event_name != 'pull_request'
        run: |
          docker push --all-tags "${IMAGE_NAME}"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "${{ steps.vars.outputs.image }}")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Imagen publicada: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  # ==============================================================
  # 5. Despliegue Automatico en Entorno Cloud Simulado con Docker Compose (IE4 / IE5)
  # ==============================================================
  deploy-compose:
    name: 5. Despliegue Orquestado con Docker Compose (gateway + 2 replicas + PostgreSQL)
    needs: [build-image, sonarcloud]
    # Requiere imagen aprobada y Quality Gate aprobado (o no aplicable en PR de Dependabot)
    if: ${{ !cancelled() && needs.build-image.result == 'success' && (needs.sonarcloud.result == 'success' || needs.sonarcloud.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: http://localhost:8080/students
    env:
      IMAGE: ${{ needs.build-image.outputs.image }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Descargar imagen aprobada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagen-docker

      - name: Cargar imagen en Docker
        run: docker load -i bdget-image.tar

      - name: Desplegar orquestacion (sin reconstruir la imagen)
        run: |
          echo "Desplegando ${IMAGE}"
          docker compose up -d --no-build --wait --wait-timeout 240
          docker compose ps

      - name: Smoke test funcional a traves del gateway
        run: bash scripts/smoke-test.sh http://localhost:8080

      - name: Prueba de escalabilidad horizontal (3 replicas)
        run: |
          docker compose up -d --no-build --wait --wait-timeout 240 --scale bdget-service=3
          docker compose ps bdget-service
          test "$(docker compose ps -q bdget-service | wc -l)" -eq 3
          bash scripts/smoke-test.sh http://localhost:8080

      - name: Verificar trazabilidad de la version desplegada
        run: |
          curl -fs http://localhost:8080/actuator/info | tee info.json
          grep -q "${GITHUB_SHA}" info.json

      - name: Registrar logs de trazabilidad
        if: always()
        run: docker compose logs --tail=100

      - name: Detener orquestacion
        if: always()
        run: docker compose down -v

  # ==============================================================
  # 6. Despliegue Automatico en Kubernetes (cluster kind) (IE4 / IE5)
  # ==============================================================
  deploy-kubernetes:
    name: 6. Despliegue en Kubernetes (kind) con Rolling Update
    needs: [build-image, sonarcloud]
    if: ${{ !cancelled() && needs.build-image.result == 'success' && (needs.sonarcloud.result == 'success' || needs.sonarcloud.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build-image.outputs.image }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar manifiestos contra el esquema de Kubernetes (kubeconform)
        run: |
          docker run --rm -v "${PWD}/k8s:/k8s" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.33.0 /k8s

      - name: Descargar imagen aprobada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagen-docker

      - name: Crear cluster Kubernetes (kind)
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: bdget

      - name: Cargar imagen en el cluster
        run: kind load image-archive bdget-image.tar --name bdget

      # metrics-server entrega el uso de CPU/memoria que necesita el HPA para autoescalar
      - name: Instalar metrics-server (requerido por el HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
          # En kind los kubelets usan certificados autofirmados
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s

      - name: Desplegar manifiestos
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          # Secreto generado en cada despliegue: la clave nunca se versiona en el repositorio
          kubectl -n bdget create secret generic bdget-db-secret \
            --from-literal=DB_USER=bdget \
            --from-literal=DB_PASSWORD="$(openssl rand -base64 24)" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Se despliega exactamente la imagen construida y escaneada en este pipeline
          mkdir -p rendered
          cp k8s/*.yaml rendered/
          sed -i "s#image: bdget:local#image: ${IMAGE}#" rendered/03-deployment.yaml
          grep -n "image:" rendered/03-deployment.yaml
          kubectl apply -f rendered/
          kubectl -n bdget annotate deployment/bdget-deployment \
            kubernetes.io/change-cause="commit ${GITHUB_SHA} - run ${GITHUB_RUN_ID}" --overwrite

      - name: Esperar rollout
        run: |
          kubectl -n bdget rollout status statefulset/bdget-db --timeout=180s
          kubectl -n bdget rollout status deployment/bdget-deployment --timeout=300s
          kubectl -n bdget get all,hpa,pdb,resourcequota

      - name: Smoke test en Kubernetes
        run: |
          kubectl -n bdget port-forward service/bdget-service 8081:8080 > /dev/null 2>&1 &
          sleep 3
          bash scripts/smoke-test.sh http://localhost:8081

      - name: Verificar autoescalado (HPA leyendo metricas reales)
        run: |
          for i in $(seq 1 24); do
            TARGETS=$(kubectl -n bdget get hpa bdget-hpa -o jsonpath='{.status.currentMetrics[*].resource.current.averageUtilization}')
            if [ -n "$TARGETS" ]; then
              echo "HPA activo. Uso actual (CPU% memoria%): ${TARGETS}"
              kubectl -n bdget get hpa bdget-hpa
              kubectl -n bdget top pods
              {
                echo "## Autoescalado (HPA)"
                echo ""
                echo '```'
                kubectl -n bdget get hpa bdget-hpa
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Esperando metricas del HPA (intento $i)..."
            sleep 10
          done
          echo "::warning::El HPA aun no recibe metricas; el despliegue funciona pero el autoescalado no pudo verificarse."
          kubectl -n bdget describe hpa bdget-hpa

      - name: Historial de despliegues (trazabilidad)
        if: always()
        run: kubectl -n bdget rollout history deployment/bdget-deployment || true

      - name: Diagnostico en caso de fallo
        if: failure()
        run: |
          kubectl -n bdget get events --sort-by=.lastTimestamp | tail -40
          kubectl -n bdget describe pods | tail -80
          kubectl -n bdget logs -l app=bdget --tail=80 || true
          kubectl -n bdget logs -l app=bdget-db --tail=40 || true

  # ==============================================================
  # 7. Reporte de Trazabilidad del Pipeline (IE4)
  # ==============================================================
  traceability:
    name: 7. Reporte de Trazabilidad
    needs: [build-test, sonarcloud, security-scan, build-image, deploy-compose, deploy-kubernetes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generar reporte de trazabilidad
        run: |
          {
            echo "## Trazabilidad: desarrollo -> produccion"
            echo ""
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Rama / referencia | \`${GITHUB_REF_NAME}\` |"
            echo "| Evento | ${GITHUB_EVENT_NAME} |"
            echo "| Autor del cambio | @${GITHUB_ACTOR} |"
            echo "| Ejecucion | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo "| Imagen | \`${{ needs.build-image.outputs.image }}\` |"
            echo "| Digest publicado | \`${{ needs.build-image.outputs.digest || 'no publicado (PR)' }}\` |"
            echo ""
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| 1. Pruebas y cobertura | ${{ needs.build-test.result }} |"
            echo "| 2. SonarCloud Quality Gate | ${{ needs.sonarcloud.result }} |"
            echo "| 3. Security Gate (Trivy) | ${{ needs.security-scan.result }} |"
            echo "| 4. Imagen Docker | ${{ needs.build-image.result }} |"
            echo "| 5. Despliegue Docker Compose | ${{ needs.deploy-compose.result }} |"
            echo "| 6. Despliegue Kubernetes | ${{ needs.deploy-kubernetes.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
